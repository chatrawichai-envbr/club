<header id="site-header"></header>

<main id="main">
  <div class="wrap wrap-mid">
    <h1>ประชาสัมพันธ์ / ประกาศกิจกรรม</h1>

    <div id="loading" class="loading">กำลังโหลดข้อมูล...</div>

    <div id="content" hidden>
      <div class="card">
        <div class="card-head">
          <h2 id="form-title">เพิ่มประกาศใหม่</h2>
        </div>
        <p class="hint mt-0">
          ประกาศที่บันทึกใหม่จะเป็น <b>ฉบับร่าง</b> ก่อน สมาชิกและบุคคลทั่วไปจะยังไม่เห็น
          จนกดเผยแพร่ และเห็นได้เฉพาะประกาศที่เผยแพร่แล้วเท่านั้น
        </p>
        <form class="ann-form" id="ann-form">
          <div>
            <label for="f-title">หัวข้อประกาศ <span class="req">*</span></label>
            <input type="text" id="f-title" maxlength="200" required
                   placeholder="เช่น ขอเชิญประชุมใหญ่สามัญประจำปี 2569">
          </div>
          <div class="row2">
            <div>
              <label for="f-body">รายละเอียด <span class="req">*</span></label>
              <textarea id="f-body" rows="6" maxlength="20000"
                        placeholder="รายละเอียดกิจกรรม วันเวลา สถานที่ และการติดต่อ"></textarea>
            </div>
            <div>
              <label for="f-date">วันที่จัดกิจกรรม</label>
              <input type="date" id="f-date">
              <p class="hint">ไม่ใส่ก็ได้ ถ้าเป็นประกาศทั่วไปที่ไม่มีวันจัดงาน</p>
            </div>
          </div>
          <div class="btn-row">
            <button class="btn" type="submit" id="btn-save">บันทึกฉบับร่าง</button>
            <button class="btn btn-ghost" type="button" id="btn-cancel" hidden>ยกเลิกการแก้ไข</button>
          </div>
        </form>
      </div>

      <div class="tabs" id="tabs">
        <button data-tab="draft" class="on">ฉบับร่าง<span class="c" id="c-draft">0</span></button>
        <button data-tab="published">เผยแพร่แล้ว<span class="c" id="c-published">0</span></button>
        <button data-tab="archived">คลังประกาศ<span class="c" id="c-archived">0</span></button>
        <button data-tab="all">ทั้งหมด</button>
      </div>

      <div id="list"></div>
    </div>
  </div>
</main>
