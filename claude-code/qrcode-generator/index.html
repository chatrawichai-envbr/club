                        <span class="theme-gradient text-white rounded-full w-7 h-7 sm:w-8 sm:h-8 flex items-center justify-center text-sm shadow-lg">1</span>
                        เลือกประเภทข้อมูล
                    </h2>
                    <div class="grid grid-cols-3 sm:grid-cols-6 gap-2 sm:gap-3 mb-6 relative z-10">
                        <button data-type="url" id="type-url" class="type-btn active flex flex-col items-center justify-center p-3 sm:p-4 rounded-xl sm:rounded-2xl border-2 theme-border theme-bg-soft theme-text-solid shadow-sm transition-all">
                            <svg class="w-6 h-6 sm:w-7 sm:h-7 mb-1 sm:mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>

                            <svg class="w-6 h-6 sm:w-7 sm:h-7 mb-1 sm:mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"></path></svg>

                            <span class="text-[10px] sm:text-xs font-medium">เบอร์โทร</span>

                            <span class="text-[10px] sm:text-xs font-medium">อีเมล</span>
                        </button>
                        <button data-type="promptpay" id="type-promptpay" class="type-btn flex flex-col items-center justify-center p-3 sm:p-4 rounded-xl sm:rounded-2xl border-2 border-transparent bg-white/60 text-gray-500 hover:bg-white transition-all">
                            <svg class="w-6 h-6 sm:w-7 sm:h-7 mb-1 sm:mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>

                    <div id="input-container" class="space-y-4 relative z-10">

                            <input type="url" id="data-url" placeholder="https://www.example.com" class="w-full px-4 sm:px-5 py-3 sm:py-3.5 rounded-xl sm:rounded-2xl border-0 ring-1 ring-gray-200 focus:ring-2 outline-none transition-all text-gray-800 text-sm sm:text-base">

                        <div id="input-text" class="input-group hidden">
                            <label class="block text-sm font-semibold text-gray-700 mb-2">ข้อความ (รองรับภาษาไทย)</label>

                        </div>
                        <div id="input-wifi" class="input-group hidden space-y-4">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">ชื่อ WiFi (SSID)</label>
                                <input type="text" id="wifi-ssid" placeholder="ชื่อ WiFi" class="w-full px-4 sm:px-5 py-3 rounded-xl border-0 ring-1 ring-gray-200 outline-none text-sm sm:text-base">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">รหัสผ่าน</label>
                                <input type="text" id="wifi-pass" placeholder="รหัสผ่าน" class="w-full px-4 sm:px-5 py-3 rounded-xl border-0 ring-1 ring-gray-200 outline-none text-sm sm:text-base">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">ความปลอดภัย</label>
                                <select id="wifi-type" class="w-full px-4 sm:px-5 py-3 rounded-xl border-0 ring-1 ring-gray-200 outline-none appearance-none font-medium text-sm sm:text-base">
                                    <option value="WPA">WPA/WPA2/WPA3</option>
                                    <option value="WEP">WEP</option>
                                    <option value="nopass">ไม่มีรหัสผ่าน</option>
                                </select>
                            </div>
                        </div>
                        <div id="input-phone" class="input-group hidden">
                            <label class="block text-sm font-semibold text-gray-700 mb-2">เบอร์โทรศัพท์ติดต่อ</label>
                            <input type="tel" id="data-phone" placeholder="081-xxx-xxxx" class="w-full px-4 sm:px-5 py-3 sm:py-3.5 rounded-xl sm:rounded-2xl border-0 ring-1 ring-gray-200 focus:ring-2 outline-none transition-all text-gray-800 text-sm sm:text-base">
                        </div>
                        <div id="input-email" class="input-group hidden space-y-4">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">อีเมลผู้รับ</label>
                                <input type="email" id="email-to" placeholder="hello@company.com" class="w-full px-4 sm:px-5 py-3 rounded-xl border-0 ring-1 ring-gray-200 outline-none text-sm sm:text-base">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">หัวข้อ (Subject)</label>

                            </div>
                        </div>
                        <div id="input-promptpay" class="input-group hidden space-y-4">

                                <input type="text" id="promptpay-id" placeholder="0812345678 หรือ 1-2345-xxxxx-xx-x" class="w-full px-4 sm:px-5 py-3 rounded-xl border-0 ring-1 ring-gray-200 outline-none text-sm sm:text-base">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">จำนวนเงิน (บาท)</label>
                                <input type="number" id="promptpay-amount" placeholder="0.00" step="0.01" min="0" class="w-full px-4 sm:px-5 py-3 rounded-xl border-0 ring-1 ring-gray-200 outline-none text-sm sm:text-base">
                            </div>
                        </div>

                        <div class="space-y-4">
                            <div class="flex items-center justify-between p-3 rounded-xl bg-white/50 border border-white">

                                <input type="color" id="qrColorDark" value="#000000" class="w-10 h-10 rounded-full cursor-pointer shadow-sm border-2 border-white ring-1 ring-gray-200">
                            </div>
                            <div class="flex items-center justify-between p-3 rounded-xl bg-white/50 border border-white">
                                <label class="text-xs font-semibold text-gray-500 uppercase">สีพื้นหลัง</label>
                                <input type="color" id="qrColorLight" value="#ffffff" class="w-10 h-10 rounded-full cursor-pointer shadow-sm border-2 border-white ring-1 ring-gray-200">
                            </div>
                        </div>

                                <label class="block text-xs font-semibold text-gray-500 mb-1.5 uppercase">ลวดลายพิกเซล</label>
                                <select id="dotsType" class="w-full text-sm px-4 py-3 rounded-xl border-0 ring-1 ring-gray-200 bg-white/80 focus:ring-2 outline-none appearance-none font-medium">
                                    <option value="rounded">สี่เหลี่ยมมน</option>
                                    <option value="dots">จุดกลม</option>
                                    <option value="extra-rounded">โค้งมนมากพิเศษ</option>
                                    <option value="square">สี่เหลี่ยม (มาตรฐาน)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 mb-1.5 uppercase">กรอบมุม</label>
                                <select id="cornersType" class="w-full text-sm px-4 py-3 rounded-xl border-0 ring-1 ring-gray-200 bg-white/80 focus:ring-2 outline-none appearance-none font-medium">
                                    <option value="extra-rounded">โค้งมนมาก</option>
                                    <option value="dot">ทรงกลม</option>
                                    <option value="square">เหลี่ยม</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="glass-card rounded-3xl p-5 sm:p-7">
