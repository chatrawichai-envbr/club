<script>
  /*!
  * app.js - แกนกลางของระบบ (ใช้ร่วมกันทุกหน้า)
  * ---------------------------------------------------------------
  * ลำดับการโหลดในไฟล์หน้า (pages/*.html) ต้องเป็น
  *   0. partials/js_frame_guard ใน head (ผ่าน FRAME_GUARD) ตั้งค่า window.GAS_FRAME
  *   1. supabase-js (CDN)
  *   2. window.GAS = { url, params }  ค่าจากฝั่งเซิร์ฟเวอร์ผ่าน scriptlet
  *   3. partials/js_config
  *   4. partials/js_app  (ไฟล์นี้)
  */
  (function (global) {
    "use strict";

    var CFG = global.APP_CONFIG;
    if (!CFG) throw new Error("ไม่พบ APP_CONFIG - ต้องรวม partials/js_config ก่อน partials/js_app");
    if (!global.supabase) throw new Error("ไม่พบ supabase-js - ต้องรวม partials/vendor_supabase (CDN) ก่อน partials/js_app");

    var sb = global.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_PUBLISHABLE_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        storageKey: "brp-env-club-auth"
      }
    });

    /* ================= ตัวช่วย DOM ================= */
    function $(sel, root) {
      return (root || document).querySelector(sel);
    }
    function $$(sel, root) {
      return Array.prototype.slice.call((root || document).querySelectorAll(sel));
    }
    function esc(s) {
      if (s === null || s === undefined) return "";
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }
    function el(tag, attrs, children) {
      var node = document.createElement(tag);
      if (attrs) {
        Object.keys(attrs).forEach(function (k) {
          var v = attrs[k];
          if (v === null || v === undefined || v === false) return;
          if (k === "class") node.className = v;
          else if (k === "text") node.textContent = v;
          else if (k === "html") node.innerHTML = v;
          else if (k.slice(0, 2) === "on" && typeof v === "function") {
            node.addEventListener(k.slice(2).toLowerCase(), v);
          } else if (v === true) node.setAttribute(k, "");
          else node.setAttribute(k, v);
        });
      }
      (children || []).forEach(function (c) {
        if (c === null || c === undefined || c === false) return;
        node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
      });
      return node;
    }

    /*
    * ================= เส้นทางหน้า (Google Apps Script) =================
    * ระบบเดิมเป็นเว็บสถิตหลายหน้า (xxx.html) ย้ายมาโฮสต์บน Google Apps Script
    * ซึ่งมีจุดเข้าเดียว (doGet) จึงใช้พารามิเตอร์ ?page=xxx แทนชื่อไฟล์
    * pageUrl() สร้างลิงก์ภายในระบบ, currentPage() อ่านหน้าปัจจุบันจาก URL
    *
    * ลิงก์ฐานและพารามิเตอร์ของ URL ต้องมาจากฝั่งเซิร์ฟเวอร์ผ่าน window.GAS
    * อ่านจาก location ของหน้าเองไม่ได้ เพราะ Google Apps Script แสดงหน้าเว็บ
    * ในกรอบ (iframe) คนละโดเมนกับ URL ที่ผู้ใช้เปิด กรอบนั้นจึงไม่มีทั้ง
    * ?page= และพารามิเตอร์อื่น ๆ ติดมาด้วย และอ่าน URL ของหน้านอกไม่ได้
    */
    var GAS = global.GAS || {};
    var GAS_PARAMS = (GAS && typeof GAS.params === "object" && GAS.params) || {};
    var BASE_URL = String(GAS.url || "");

    /** รายชื่อหน้าทั้งหมดของระบบ ต้องตรงกับ PAGE_MAP ใน Code.gs */
    var PAGES = [
      "index", "login", "register", "forgot", "reset", "terms", "privacy", "verify",
      "app", "apply", "payment", "card", "receipt",
      "admin-index", "admin-dashboard", "admin-applications", "admin-payments",
      "admin-members", "admin-member-edit", "admin-audit", "admin-announcements",
      "admin-signatories", "admin-settings"
    ];

    function pageUrl(page, params) {
      var qs = "page=" + encodeURIComponent(page || "index");
      if (params) {
        Object.keys(params).forEach(function (k) {
          var v = params[k];
          if (v === undefined || v === null || v === "") return;
          qs += "&" + encodeURIComponent(k) + "=" + encodeURIComponent(v);
        });
      }
      return BASE_URL + "?" + qs;
    }

    function currentPage() {
      var p = GAS_PARAMS.page;
      return p ? String(p) : "index";
    }

    /** อ่านพารามิเตอร์จาก URL ภายนอก (แทน new URLSearchParams(location.search)) */
    function param(name) {
      var v = GAS_PARAMS[name];
      return v === undefined || v === null ? null : String(v);
    }

    /*
    * พารามิเตอร์ของหน้าปลายทางที่ต้องพาไปด้วยเมื่อต้องเข้าสู่ระบบก่อน
    *
    * รุ่นหน้าเว็บสถิต (คลัง home) เก็บ query string ไว้ใน next= ทั้งก้อน (member-edit.html?id=...)
    * แต่ next= ของรุ่นนี้รับได้แค่รหัสหน้า (ผ่านบัญชีขาวของ safeNext) จึงต้องส่งพารามิเตอร์แยกมาเอง
    * ถ้าไม่ส่ง ลิงก์หน้าแก้ไขข้อมูลสมาชิกที่เปิดตอนยังไม่ได้เข้าสู่ระบบ
    * จะพากลับมาหน้าเดิมโดยไม่มีรหัสสมาชิก ผู้ดูแลเห็นแค่ "ไม่พบรหัสสมาชิกใน URL"
    * ต้องเป็นชื่อที่อยู่ใน ALLOWED_PARAMS ของ Code.gs ด้วย
    */
    var CARRY_PARAMS = ["id"];

    function carryParams(into) {
      var o = into || {};
      CARRY_PARAMS.forEach(function (k) {
        var v = param(k);
        if (v) o[k] = v;
      });
      return o;
    }

    /** ลิงก์ของหน้า next หลังเข้าสู่ระบบ พร้อมพารามิเตอร์ที่ติดมากับหน้าเข้าสู่ระบบ */
    function nextUrl(next) {
      return pageUrl(next, carryParams());
    }

    /*
    * โทเคนจากลิงก์ในอีเมล (ตั้งรหัสผ่านใหม่ / ยืนยันอีเมล)
    *
    * ลิงก์แบบเดิมของ Supabase ส่งโทเคนมาหลังเครื่องหมาย # ของ URL
    * ซึ่งใช้กับเว็บแอปบน Google Apps Script ไม่ได้เลย เพราะหน้าเว็บอยู่ในกรอบ
    * คนละโดเมนกับ URL ที่ผู้ใช้เปิด จึงอ่านส่วนหลัง # ของหน้านอกไม่ได้
    * และส่วนหลัง # ไม่ถูกส่งมาถึงเซิร์ฟเวอร์ด้วย จึงรับมาทางพารามิเตอร์แทนไม่ได้
    *
    * แบบใหม่ใช้ token_hash ที่อยู่ในพารามิเตอร์ของ URL ตามปกติ
    * doGet จึงอ่านได้และส่งต่อมาให้หน้าเว็บ แล้วแลกเป็น session ด้วย verifyOtp
    * วิธีนี้ยังใช้ได้แม้ผู้ใช้เปิดอีเมลคนละเครื่องกับตอนที่กดขอลิงก์
    *
    * ต้องแก้เทมเพลตอีเมลใน Supabase ให้ลิงก์เป็น
    *   ...exec?page=reset&token_hash={{ .TokenHash }}&type=recovery
    */
    var OTP_TYPES = ["recovery", "email", "signup", "invite", "magiclink", "email_change"];

    function emailLinkToken() {
      var h = param("token_hash");
      if (!h) return null;
      var t = param("type") || "recovery";
      return { token_hash: h, type: OTP_TYPES.indexOf(t) >= 0 ? t : "recovery" };
    }

    /*
    * ตรวจปลายทางของ next= ก่อนสั่งเปลี่ยนหน้า
    *
    * ตรวจแบบบัญชีขาว รับเฉพาะรหัสหน้าที่มีอยู่จริงในระบบเท่านั้น
    * ค่าที่ไม่เข้าเกณฑ์ทั้งหมดถือว่าไม่ปลอดภัย และใช้ปลายทางสำรองแทน
    *
    * ต้องล้างอักขระควบคุม (tab ขึ้นบรรทัดใหม่ carriage return) และช่องว่างทิ้งก่อน
    * เพราะตัวแปลง URL ของเบราว์เซอร์ตัดอักขระเหล่านี้ออกก่อนตีความเสมอ
    * ค่าอย่าง "j\navascript:..." จึงกลายเป็น "javascript:..." ได้ในภายหลัง
    * การเทียบกับบัญชีขาวตรง ๆ จึงต้องเทียบกับค่าที่ล้างแล้วเท่านั้น
    */
    function safeNext(raw, fallback) {
      var s = String(raw === null || raw === undefined ? "" : raw)
        .replace(/[\u0000-\u0020\u007f]/g, "");
      return PAGES.indexOf(s) >= 0 ? s : fallback;
    }

    /*
    * พาผู้ใช้ไปหน้าอื่นด้วยคำสั่งของสคริปต์ (ไม่ใช่การกดลิงก์)
    * ทุกจุดในระบบต้องเรียก go() ห้ามเขียน window.top.location เองอีก
    *
    * กรอบของ Apps Script ยอมให้เปลี่ยนหน้าบนสุดได้เฉพาะตอนที่ผู้ใช้เพิ่งกดหรือพิมพ์
    * (allow-top-navigation-by-user-activation) คำสั่งที่เกิดเองตอนโหลดหน้า
    * เช่น พาไปหน้าเข้าสู่ระบบเมื่อยังไม่ได้ล็อกอิน จะถูกเบราว์เซอร์ปฏิเสธ
    * ผู้ใช้เห็นหน้าค้างอยู่ที่ "กำลังโหลด" ไปตลอดโดยไม่มีข้อความใดบอก
    *
    * go() จึงแยกเป็นสองกรณี
    *   - อยู่ในหน้าครอบของชมรม: ขอให้หน้าครอบเปลี่ยนหน้าให้
    *     หน้าครอบเป็นหน้าบนสุดที่ไม่ได้อยู่ในกรอบใด จึงเปลี่ยนหน้าได้เสมอ
    *   - เปิดตรงที่ /exec: ลองเปลี่ยนหน้าเอง ถ้าไม่สำเร็จจึงแสดงปุ่มให้กดไปต่อ
    *     การกดปุ่มคือการกระทำของผู้ใช้ เบราว์เซอร์จึงยอม
    */
    var FRAME = global.GAS_FRAME || { embedded: false, ready: Promise.resolve(null) };

    function go(url, replace) {
      if (FRAME.embedded) {
        FRAME.ready.then(function (host) {
          // ยืนยันหน้าครอบไม่ได้ = ถูกซ้อนในเว็บอื่น ไม่พาหน้าเว็บนั้นไปไหนทั้งสิ้น
          if (!host) return;
          host.win.postMessage({ type: "brp:navigate", url: url, replace: !!replace }, host.origin);
          goFallbackLater(url);
        });
        return;
      }
      try {
        if (replace) global.top.location.replace(url);
        else global.top.location.href = url;
      } catch (e) {
        showGoLink(url);
        return;
      }
      goFallbackLater(url);
    }

    /*
    * บางเบราว์เซอร์ไม่โยนข้อผิดพลาด แค่ไม่เปลี่ยนหน้าเฉย ๆ
    * ถ้าเปลี่ยนหน้าได้จริง หน้านี้ถูกปิดไปก่อนถึงเวลา ปุ่มจึงไม่มีโอกาสขึ้น
    */
    function goFallbackLater(url) {
      setTimeout(function () { showGoLink(url); }, 5000);
    }

    function showGoLink(url) {
      if (!document.body || document.getElementById("go-fallback")) return;
      toastHost().appendChild(el("div", { class: "toast", id: "go-fallback" }, [
        "หากหน้าจอไม่เปลี่ยนเอง กรุณากดปุ่มนี้เพื่อไปต่อ ",
        el("a", { class: "btn btn-sm", href: url, target: "_top", text: "ไปต่อ" })
      ]));
    }

    /* ================= วันที่และตัวเลขแบบไทย ================= */
    var TH_MONTH = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน",
                    "กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
    var TH_MONTH_SHORT = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.",
                          "ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

    function toDate(v) {
      if (!v) return null;
      if (v instanceof Date) return isNaN(v.getTime()) ? null : v;
      var s = String(v);
      // 'YYYY-MM-DD' ให้ตีความเป็นเวลาท้องถิ่น ไม่ใช่ UTC เพื่อไม่ให้วันเคลื่อน
      var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
      var d = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(s);
      return isNaN(d.getTime()) ? null : d;
    }

    var fmt = {
      /** 12 กันยายน 2569 */
      thaiDate: function (v) {
        var d = toDate(v);
        if (!d) return "-";
        return d.getDate() + " " + TH_MONTH[d.getMonth()] + " " + (d.getFullYear() + 543);
      },
      /** 12 ก.ย. 2569 */
      thaiDateShort: function (v) {
        var d = toDate(v);
        if (!d) return "-";
        return d.getDate() + " " + TH_MONTH_SHORT[d.getMonth()] + " " + (d.getFullYear() + 543);
      },
      /** 12/09/2569 */
      thaiDateNum: function (v) {
        var d = toDate(v);
        if (!d) return "-";
        return String(d.getDate()).padStart(2, "0") + "/" +
              String(d.getMonth() + 1).padStart(2, "0") + "/" + (d.getFullYear() + 543);
      },
      /** 12 ก.ย. 2569 14:35 */
      thaiDateTime: function (v) {
        var d = toDate(v);
        if (!d) return "-";
        return fmt.thaiDateShort(d) + " " +
              String(d.getHours()).padStart(2, "0") + ":" +
              String(d.getMinutes()).padStart(2, "0");
      },
      /** ค.ศ. YYYY-MM-DD สำหรับ input[type=date] */
      isoDate: function (v) {
        var d = toDate(v);
        if (!d) return "";
        return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
              String(d.getDate()).padStart(2, "0");
      },
      money: function (n) {
        var v = Number(n || 0);
        return v.toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      },
      int: function (n) {
        return Number(n || 0).toLocaleString("th-TH");
      },
      /** จำนวนวันคงเหลือจนถึงวันที่ระบุ */
      daysUntil: function (v) {
        var d = toDate(v);
        if (!d) return null;
        var today = new Date();
        today.setHours(0, 0, 0, 0);
        d.setHours(0, 0, 0, 0);
        return Math.round((d - today) / 86400000);
      },
      fileSize: function (b) {
        if (b < 1024) return b + " ไบต์";
        if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
        return (b / 1048576).toFixed(2) + " MB";
      }
    };

    /* ================= เลขประจำตัวประชาชน ================= */
    function validateThaiId(id) {
      var d = String(id || "").replace(/\D/g, "");
      if (d.length !== 13) return false;
      var sum = 0;
      for (var i = 0; i < 12; i++) sum += parseInt(d.charAt(i), 10) * (13 - i);
      return ((11 - (sum % 11)) % 10) === parseInt(d.charAt(12), 10);
    }
    function formatThaiId(id) {
      var d = String(id || "").replace(/\D/g, "");
      if (d.length !== 13) return String(id || "");
      return d[0] + "-" + d.slice(1, 5) + "-" + d.slice(5, 10) + "-" + d.slice(10, 12) + "-" + d[12];
    }
    function maskThaiId(id) {
      var d = String(id || "").replace(/\D/g, "");
      if (d.length !== 13) return "-";
      return "x-xxxx-xxxxx-xx-" + d[12] + " (ลงท้าย " + d.slice(9) + ")";
    }

    /* ================= toast ================= */
    function toastHost() {
      var h = $(".toast-host");
      if (!h) {
        h = el("div", { class: "toast-host", role: "status", "aria-live": "polite" });
        document.body.appendChild(h);
      }
      return h;
    }
    function toast(msg, type, ms) {
      var t = el("div", { class: "toast " + (type || ""), text: String(msg) });
      toastHost().appendChild(t);
      setTimeout(function () {
        t.style.transition = "opacity .25s";
        t.style.opacity = "0";
        setTimeout(function () {
          if (t.parentNode) t.parentNode.removeChild(t);
        }, 260);
      }, ms || (type === "err" ? 7000 : 4000));
      return t;
    }

    /* ================= modal ================= */
    function modal(opts) {
      // opts: { title, bodyHtml, okText, cancelText, danger, needReason, reasonLabel }
      return new Promise(function (resolve) {
        var host = el("div", { class: "modal-host" });
        var reasonId = "m-reason-" + Date.now();
        var box = el("div", { class: "modal" + (opts.wide ? " modal-wide" : "") });
        box.innerHTML =
          '<h3>' + esc(opts.title || "ยืนยัน") + "</h3>" +
          (opts.bodyHtml || (opts.body ? "<p>" + esc(opts.body) + "</p>" : "")) +
          (opts.needReason
            ? '<div class="field mt-2"><label class="req" for="' + reasonId + '">' +
              esc(opts.reasonLabel || "เหตุผล") +
              '</label><textarea id="' + reasonId + '" rows="3"></textarea>' +
              '<div class="err-text" hidden>กรุณาระบุเหตุผล</div></div>'
            : "") +
          '<div class="btn-row btn-row-end mt-3">' +
          '<button type="button" class="btn btn-ghost" data-act="cancel">' +
          esc(opts.cancelText || "ยกเลิก") + "</button>" +
          '<button type="button" class="btn ' + (opts.danger ? "btn-danger" : "") +
          '" data-act="ok">' + esc(opts.okText || "ยืนยัน") + "</button>" +
          "</div>";
        host.appendChild(box);
        document.body.appendChild(host);

        function close(val) {
          if (host.parentNode) host.parentNode.removeChild(host);
          document.removeEventListener("keydown", onKey);
          resolve(val);
        }
        function onKey(e) {
          if (e.key === "Escape") close(null);
        }
        document.addEventListener("keydown", onKey);
        host.addEventListener("click", function (e) {
          if (e.target === host) close(null);
        });
        $('[data-act="cancel"]', box).addEventListener("click", function () {
          close(null);
        });
        $('[data-act="ok"]', box).addEventListener("click", function () {
          if (opts.needReason) {
            var ta = $("#" + reasonId, box);
            var v = ta.value.trim();
            if (!v) {
              ta.setAttribute("aria-invalid", "true");
              $(".err-text", box).hidden = false;
              ta.focus();
              return;
            }
            close(v);
          } else {
            close(true);
          }
        });
        var first = $('[data-act="ok"]', box);
        if (opts.needReason) first = $("#" + reasonId, box);
        if (first) first.focus();
      });
    }

    function confirmDialog(title, body, opts) {
      return modal(Object.assign({ title: title, body: body }, opts || {})).then(function (r) {
        return r === true;
      });
    }

    /* ================= ข้อผิดพลาด ================= */
    /*

    // ข้อผิดพลาดที่ผู้สมัครแก้เองไม่ได้ ต้องให้ผู้ดูแลระบบไปเปิด/ตั้งค่าให้ก่อน
    var SIGNUP_BLOCKED = {
      signup_disabled: 1,
      email_provider_disabled: 1,
      email_address_not_authorized: 1
    };

    function errCode(e) {
      if (!e) return "";
      var c = e.code || e.error_code || (e.error && e.error.code) || "";
      if (c) return String(c);
      // เซิร์ฟเวอร์รุ่นเก่าอาจไม่ส่งรหัสมา จึงเทียบจากข้อความเป็นทางสำรอง
      var m = e.message || e.msg || "";
      if (/Signups?\s+not\s+allowed/i.test(m)) return "signup_disabled";
      if (/[Ee]mail\s+signups?\s+(are\s+)?disabled/i.test(m)) return "email_provider_disabled";
      if (/[Ee]mail\s+address.*not\s+authorized/i.test(m)) return "email_address_not_authorized";
      return "";
    }

    // ระบบปิดรับสมัคร (หรือส่งอีเมลไม่ได้) ใช่หรือไม่ — หน้าสมัครใช้แยกข้อความ
    function isSignupBlocked(e) {
      return !!SIGNUP_BLOCKED[errCode(e)];
    }

    function errMsg(e) {
      if (!e) return "เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ";

      var byCode = AUTH_CODE_TH[errCode(e)];
      if (byCode) return byCode;

      var m = e.message || e.error_description || e.msg || String(e);

      var map = {
        "Invalid login credentials": "อีเมลหรือรหัสผ่านไม่ถูกต้อง",
        "Email not confirmed": "ยังไม่ได้ยืนยันอีเมล กรุณาตรวจกล่องจดหมายของท่าน",

        "For security purposes, you can only request this after 60 seconds.":

        "New password should be different from the old password.":
          "รหัสผ่านใหม่ต้องไม่ซ้ำกับรหัสผ่านเดิม",
        "Auth session missing!": "เซสชันหมดอายุ กรุณาเข้าสู่ระบบอีกครั้ง",
        "Signups not allowed for this instance":
          "ขณะนี้ระบบปิดรับสมัครบัญชีใหม่ กรุณาติดต่อผู้ดูแลระบบของชมรมให้เปิดรับสมัครก่อน",
        "Error sending confirmation email":
          "ส่งอีเมลยืนยันไม่สำเร็จ กรุณาติดต่อผู้ดูแลระบบเพื่อตรวจการตั้งค่าอีเมลของระบบ",
        "Database error saving new user":
          "บันทึกบัญชีผู้ใช้ใหม่ไม่สำเร็จ กรุณาติดต่อผู้ดูแลระบบ"
      };
      if (map[m]) return map[m];

      if (/duplicate key|already exists/i.test(m)) return "ข้อมูลนี้มีอยู่ในระบบแล้ว";
      if (/violates row-level security|permission denied/i.test(m)) {
        return "ไม่มีสิทธิ์ดำเนินการนี้";
      }
      if (/Failed to fetch|NetworkError|network/i.test(m)) {
        return "เชื่อมต่อระบบไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่";
      }
      if (/exceeded the maximum allowed size|Payload too large/i.test(m)) {
        return "ไฟล์มีขนาดใหญ่เกินกำหนด";
      }
      if (/mime type .* is not supported/i.test(m)) return "ชนิดไฟล์นี้ไม่รองรับ";
      return m;
    }

    /* ================= เรียก RPC ================= */
    function rpc(name, args) {
      return sb.rpc(name, args || {}).then(function (res) {
        if (res.error) throw res.error;
        return res.data;
      });
    }

    /*
    * เรียก Edge Function ของ Supabase
    *
    * ใช้กับงานที่ต้องมีกุญแจลับฝั่งเซิร์ฟเวอร์ เช่น การยืนยันสลิปกับธนาคาร
    * ซึ่งฝังกุญแจในหน้าเว็บไม่ได้เพราะหน้าเว็บเปิดดูโค้ดได้ทุกคน
    *
    * แนบโทเคนของผู้ใช้ไปด้วยเสมอ ฟังก์ชันปลายทางตรวจสิทธิ์เองอีกชั้น
    * ไม่โยน error เมื่อฟังก์ชันตอบกลับมาว่าไม่สำเร็จ ผู้เรียกตัดสินใจเอง
    */
    function fn(name, body) {
      return sb.functions.invoke(name, { body: body || {} }).then(function (res) {
        if (res.error) throw res.error;
        return res.data;
      });
    }

    /* ================= ค่าตั้งค่าระบบ ================= */
    var _settings = null;
    function loadSettings(force) {
      if (_settings && !force) return Promise.resolve(_settings);
      return sb
        .from("settings")
        .select("key,value")
        .then(function (res) {
          var out = JSON.parse(JSON.stringify(CFG.DEFAULTS));
          if (!res.error && res.data) {
            res.data.forEach(function (r) {
              out[r.key] = r.value;
            });
          }
          _settings = out;
          return out;
        })
        .catch(function () {
          _settings = JSON.parse(JSON.stringify(CFG.DEFAULTS));
          return _settings;
        });
    }
    function setting(key) {
      return (_settings || CFG.DEFAULTS)[key] || {};
    }

    /* ================= ประเภทหน่วยงาน ================= */
    var _orgTypes = null;
    function loadOrgTypes() {
      if (_orgTypes) return Promise.resolve(_orgTypes);
      return sb
        .from("org_types")
        .select("code,name,requires_text,sort_order")
        .eq("active", true)
        .order("sort_order")
        .then(function (res) {
          if (res.error) throw res.error;
          _orgTypes = res.data || [];
          return _orgTypes;
        });
    }

    /* ================= ระบบผู้ใช้งาน ================= */
    var auth = {
      session: function () {
        return sb.auth.getSession().then(function (r) {
          return r.data ? r.data.session : null;
        });
      },
      user: function () {
        return sb.auth.getUser().then(function (r) {
          return r.data ? r.data.user : null;
        });
      },
      /** บังคับให้เข้าสู่ระบบก่อน ถ้าไม่ได้ล็อกอินจะพาไปหน้าเข้าสู่ระบบ */
      requireLogin: function (loginPage) {
        return auth.session().then(function (s) {
          if (!s) {
            go(pageUrl(loginPage || "login", carryParams({ next: currentPage() })), true);
            return null;
          }
          return s;
        });
      },
      /** บังคับสิทธิ์ผู้ดูแลระบบ */
      /*
      * ตรวจสิทธิ์ก่อนเปิดหน้าผู้ดูแล
      * area = พื้นที่งานของหน้านั้น (applications, payments, members, audit, settings)
      * ถ้าไม่ส่ง area มา จะตรวจแค่ว่าเป็นผู้ดูแลหรือไม่ เหมือนพฤติกรรมเดิม
      *
      * นี่เป็นการกันชั้นที่สอง ชั้นแรกคือการซ่อนเมนู และชั้นที่สามคือ
      * RLS กับ require_area ที่ฐานข้อมูล ซึ่งเป็นชั้นที่กันได้จริง
      * หน้าเว็บกันได้แค่ไม่แสดงผล ผู้ใช้ที่ล็อกอินแล้วเรียก REST API ตรงได้เสมอ
      */
      requireAdmin: function (loginPage, area) {
        return auth.session().then(function (s) {
          if (!s) {
            go(pageUrl(loginPage || "admin-index", carryParams({ next: currentPage() })), true);
            return null;
          }
          function deny(title, body) {
            document.body.innerHTML =
              '<div class="wrap wrap-narrow" style="padding:60px 20px">' +
              '<div class="alert alert-err"><div><strong>' + esc(title) + "</strong>" +
              esc(body) + "</div></div>" +
              '<a class="btn btn-ghost" href="' + pageUrl("admin-dashboard") + '" target="_top">ไปหน้าภาพรวม</a> ' +
              '<a class="btn btn-ghost" href="' + pageUrl("app") + '" target="_top">กลับหน้าสมาชิก</a></div>';
            return null;
          }
          return rpc("is_admin").then(function (ok) {
            if (!ok) {
              return deny("ไม่มีสิทธิ์เข้าถึง",
                "บัญชีนี้ไม่ใช่ผู้ดูแลระบบ หากต้องการสิทธิ์ผู้ดูแล กรุณาติดต่อผู้ดูแลระบบของชมรม");
            }
            if (!area) return s;
            return rpc("admin_can", { p_area: area }).then(function (can) {
              if (!can) {
                return deny("บัญชีของท่านไม่มีสิทธิ์ในส่วนนี้",
                  "หน้านี้เปิดให้เฉพาะผู้ดูแลที่ได้รับสิทธิ์ในส่วนนี้ " +
                  "หากต้องการสิทธิ์เพิ่ม กรุณาติดต่อผู้ดูแลระดับสูงสุดของชมรม");
              }
              return s;
            });
          });
        });
      },
      signOut: function () {
        return rpc("log_client_event", { p_action: "logout" })
          .catch(function () {})
          .then(function () {
            return sb.auth.signOut();
          });
      }
    };

    /* ================= ที่เก็บไฟล์ ================= */
    var storage = {
      /** อัปโหลดไฟล์ไปยังโฟลเดอร์ของผู้ใช้ (<user_id>/<ชื่อไฟล์>) */
      upload: function (bucket, file, filename) {
        return auth.user().then(function (u) {
          if (!u) throw new Error("ต้องเข้าสู่ระบบก่อนอัปโหลดไฟล์");
          var ext = (file.name.match(/\.[a-z0-9]+$/i) || [".jpg"])[0].toLowerCase();
          var path = u.id + "/" + (filename || "file") + "-" + Date.now() + ext;
          return sb.storage
            .from(bucket)
            .upload(path, file, { cacheControl: "3600", upsert: false, contentType: file.type })
            .then(function (res) {
              if (res.error) throw res.error;
              return path;
            });
        });
      },
      /**
       * อัปโหลดไฟล์ไปยังโฟลเดอร์ของผู้ใช้คนอื่น (<user_id ปลายทาง>/<ชื่อไฟล์>)
       *
       * ใช้กรณีเดียวคือผู้ดูแลระดับสูงสุดแนบสลิปแทนสมาชิก
       * สลิปต้องอยู่ในโฟลเดอร์ของสมาชิกเจ้าของใบสมัคร ไม่ใช่ของผู้ดูแลที่อัปโหลด
       * เพราะสมาชิกต้องเปิดดูสลิปของตนได้ และฟังก์ชันฝั่งฐานข้อมูลตรวจเส้นทางนี้ซ้ำ
       *
       * ผู้ที่ไม่มีสิทธิ์จะถูกนโยบายของที่เก็บไฟล์ปฏิเสธ ไม่ได้กันแค่ที่หน้าเว็บ
       */
      uploadTo: function (bucket, file, folder, filename) {
        if (!folder) return Promise.reject(new Error("ไม่ทราบโฟลเดอร์ปลายทางของไฟล์"));
        var ext = (file.name.match(/\.[a-z0-9]+$/i) || [".jpg"])[0].toLowerCase();
        var path = folder + "/" + (filename || "file") + "-" + Date.now() + ext;
        return sb.storage
          .from(bucket)
          .upload(path, file, { cacheControl: "3600", upsert: false, contentType: file.type })
          .then(function (res) {
            if (res.error) throw res.error;
            return path;
          });
      },
      signedUrl: function (bucket, path, seconds) {
        if (!path) return Promise.resolve(null);
        return sb.storage
          .from(bucket)
          .createSignedUrl(path, seconds || 3600)
          .then(function (res) {
            if (res.error) throw res.error;
            return res.data.signedUrl;
          });
      },
      /** ดาวน์โหลดไฟล์เป็น data URL (ใช้ฝังในบัตร/PDF) */
      dataUrl: function (bucket, path) {
        if (!path) return Promise.resolve(null);
        return sb.storage
          .from(bucket)
          .download(path)
          .then(function (res) {
            if (res.error) throw res.error;
            return new Promise(function (resolve, reject) {
              var fr = new FileReader();
              fr.onload = function () {
                resolve(fr.result);
              };
              fr.onerror = reject;
              fr.readAsDataURL(res.data);
            });
          });
      },
      remove: function (bucket, path) {
        return sb.storage.from(bucket).remove([path]);
      }
    };

    /* ================= แฮช SHA-256 ================= */
    function sha256(input) {
      var p = input instanceof Blob ? input.arrayBuffer() : Promise.resolve(new TextEncoder().encode(String(input)));
      return p.then(function (buf) {
        return crypto.subtle.digest("SHA-256", buf);
      }).then(function (h) {
        return Array.prototype.map
          .call(new Uint8Array(h), function (b) {
            return b.toString(16).padStart(2, "0");
          })
          .join("");
      });
    }

    /*

    *
    * ต้องเก็บข้อความเดิมของปุ่มไว้ "เฉพาะครั้งแรก" ที่เข้าสถานะนี้

    * เรียก "กำลังอัปโหลด..." แล้วตามด้วย "กำลังบันทึก..." และ "กำลังส่งใบสมัคร..."
    *
    * ถ้าเก็บทับทุกครั้ง ข้อความจริงของปุ่มจะถูกแทนที่ด้วยข้อความของขั้นก่อนหน้า
    * พอทำงานเสร็จจึงคืนค่าผิด ปุ่มจะค้างเป็นวงกลมหมุนพร้อมข้อความเก่าตลอดไป
    * ทั้งที่งานสำเร็จแล้ว ผู้ใช้จะเข้าใจว่าระบบค้างและกดซ้ำจนเกิดข้อมูลซ้ำซ้อน
    */
    function busy(btn, on, label) {
      if (!btn) return;
      if (on) {
        if (btn.dataset.busy !== "1") {
          btn.dataset.label = btn.innerHTML;
          btn.dataset.busy = "1";
        }
        btn.disabled = true;
        btn.innerHTML = '<span class="spin"></span>' + esc(label || "กำลังดำเนินการ...");
      } else {
        btn.disabled = false;
        if (btn.dataset.busy === "1" && btn.dataset.label) {
          btn.innerHTML = btn.dataset.label;
        }
        btn.dataset.busy = "";
      }
    }

    /* ================= แถบเมนู ================= */
    // โลโก้ชมรมอ่านจากค่า base64 ที่ฝังไว้ท้ายไฟล์นี้ ไม่ได้โหลดไฟล์ภาพ
    // จึงขึ้นครบทุกหน้าเสมอ และไม่ต้องต่อพาธ base ข้างหน้าอีก
    // (เดิมใช้พาธไฟล์ หน้าในโฟลเดอร์ admin/ อยู่ลึกลงไปหนึ่งชั้นจึงต้องต่อ base เสมอ
    //  ถ้าลืมต่อจะขึ้นเป็นรูปเสียทุกหน้าผู้ดูแล ปัญหานี้หมดไปพร้อมกับการฝังภาพ)
    function logoHtml() {
      return '<img class="brand-logo" src="' + LOGO_NAV + '" ' +
            'width="40" height="40" alt="ตราสัญลักษณ์ชมรมอนามัยสิ่งแวดล้อมจังหวัดบุรีรัมย์">';
    }

    var MEMBER_NAV = [
      { href: "app", label: "สถานะการสมัคร" },
      { href: "apply", label: "ใบสมัคร" },
      { href: "payment", label: "ชำระเงิน" },
      { href: "card", label: "บัตรสมาชิก" },
      { href: "receipt", label: "ใบสำคัญรับเงิน" }
    ];

    /**
     * วาดแถบหัวเว็บ
     * mode: 'public' | 'member' | 'admin'
     */
    function renderHeader(mode, activeHref) {
      var host = $("#site-header");
      if (!host) return Promise.resolve();

      var links = [];
      if (mode === "member") links = MEMBER_NAV;
      else if (mode === "admin") {
        /*
        * เมนูผู้ดูแลขึ้นตามสิทธิ์ของบัญชีที่ล็อกอิน
        * รายการนี้เป็นรายการเต็ม จะถูกกรองด้วยคำตอบจาก admin_menu() ด้านล่าง
        *
        * การซ่อนเมนูเป็นเพียงการไม่พาผู้ใช้ไปเจอหน้าที่เข้าไม่ได้
        * การกันจริงอยู่ที่ฐานข้อมูล (RLS + require_area ในทุกฟังก์ชัน)
        * ห้ามถือว่าการซ่อนเมนูคือการรักษาความปลอดภัย
        */
        links = [
          { href: "admin-dashboard", label: "ภาพรวม", area: "dashboard" },
          { href: "admin-applications", label: "ตรวจใบสมัคร", area: "applications" },
          { href: "admin-payments", label: "ตรวจสลิป", area: "payments" },
          { href: "admin-members", label: "ทะเบียนสมาชิก", area: "members" },
          { href: "admin-audit", label: "ประวัติการแก้ไข", area: "audit" },
          { href: "admin-announcements", label: "ประชาสัมพันธ์", area: "announcements" },
          { href: "admin-signatories", label: "ผู้ลงนามในเอกสาร", area: "signatories" },
          { href: "admin-settings", label: "ตั้งค่าระบบ", area: "settings" }
        ];
      }

      function navHtmlFor(list) {
        return list
          .map(function (l) {
            return '<a href="' + pageUrl(l.href) + '" target="_top"' +
              (l.href === activeHref ? ' class="active"' : "") + ">" + esc(l.label) + "</a>";
          })
          .join("");
      }

      /*
      * วาดเมนูของผู้ดูแลตอนแรกด้วยรายการว่าง แล้วเติมเมื่อรู้สิทธิ์
      * ถ้าวาดรายการเต็มไปก่อน ผู้ใช้จะเห็นเมนูที่ตัวเองเข้าไม่ได้กะพริบขึ้นมาครู่หนึ่ง
      */
      var navHtml = mode === "admin" ? "" : navHtmlFor(links);

      host.className = "site-header";
      host.innerHTML =
        '<div class="header-row">' +
        '<a class="brand" href="' +
          pageUrl(mode === "admin" ? "admin-dashboard" : "index") + '" target="_top">' +
        logoHtml() +
        '<span class="brand-text"><b>ชมรมอนามัยสิ่งแวดล้อมจังหวัดบุรีรัมย์</b>' +
        "<span>" + (mode === "admin" ? "ระบบผู้ดูแล" : "ระบบรับสมัครสมาชิก") + "</span></span></a>" +
        '<button class="btn btn-sm nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav">☰ เมนู</button>' +
        '<nav class="nav" id="main-nav">' + navHtml +
        '<span class="nav-user" id="nav-user"></span>' +
        '<span id="nav-auth"></span>' +
        "</nav></div>";

      var tgl = $(".nav-toggle", host);
      if (tgl) {
        tgl.addEventListener("click", function () {
          var nav = $("#main-nav", host);
          var open = nav.classList.toggle("open");
          tgl.setAttribute("aria-expanded", open ? "true" : "false");
        });
      }

      if (mode === "admin") {
        /*
        * เติมเมนูเมื่อรู้สิทธิ์แล้ว
        *
        * ถ้าถามสิทธิ์ไม่สำเร็จ (เน็ตหลุด ฐานข้อมูลไม่ตอบ) ให้แสดงเมนูเต็ม
        * ไม่ใช่เมนูว่าง เพราะเมนูว่างทำให้ผู้ดูแลค้างอยู่หน้าเดียวไปไหนไม่ได้เลย
        * การแสดงเมนูที่กดแล้วเข้าไม่ได้ ยังดีกว่าไม่มีทางไปไหน
        * และไม่ได้เปิดช่องอะไร เพราะหน้าปลายทางตรวจสิทธิ์เองอีกชั้น
        * และฐานข้อมูลกันไว้อีกชั้นด้วย RLS
        */
        var fillNav = function (allowed, role) {
          var nav = $("#main-nav", host);
          if (!nav) return;
          // แทรกลิงก์ไว้ก่อนช่องชื่อผู้ใช้ ซึ่งวาดไว้แล้วตอนสร้าง header
          var frag = document.createElement("div");
          frag.innerHTML = navHtmlFor(allowed);
          var anchor = $("#nav-user", host);
          while (frag.firstChild) nav.insertBefore(frag.firstChild, anchor);
          host.setAttribute("data-admin-role", role || "");
        };

        rpc("admin_menu")
          .then(function (perm) {
            if (!perm) { fillNav(links, ""); return; }
            fillNav(links.filter(function (l) { return perm[l.area]; }), perm.role);
          })
          .catch(function () { fillNav(links, ""); });
      }

      return auth.session().then(function (s) {
        var slot = $("#nav-auth", host);
        var uslot = $("#nav-user", host);
        if (s && s.user) {
          uslot.textContent = s.user.email || "";
          var out = el("button", { type: "button", text: "ออกจากระบบ" });
          out.addEventListener("click", function () {
            busy(out, true, "กำลังออก...");
            auth.signOut().then(function () {
              go(pageUrl("index"));
            });
          });
          slot.appendChild(out);
          if (mode === "public") {
            slot.parentNode.insertBefore(
              el("a", { href: pageUrl("app"), target: "_top", text: "เข้าใช้ระบบสมาชิก" }),
              uslot
            );
          }
          // ผู้ดูแลเห็นทางเข้าหน้าผู้ดูแล
          if (mode === "member") {
            rpc("is_admin").then(function (ok) {
              if (ok) {
                slot.parentNode.insertBefore(
                  el("a", { href: pageUrl("admin-dashboard"), target: "_top", text: "หน้าระบบผู้ดูแล" }),
                  uslot
                );
              }
            }).catch(function () {});
          } else if (mode === "admin") {
            slot.parentNode.insertBefore(
              el("a", { href: pageUrl("app"), target: "_top", text: "หน้าระบบสมาชิก" }),
              uslot
            );
          }
        } else {
          slot.innerHTML =
            '<a href="' + pageUrl("login") + '" target="_top">เข้าสู่ระบบ</a>' +
            '<a href="' + pageUrl("register") + '" target="_top">สมัครใช้งาน</a>';
        }
        return s;
      });
    }

    function renderFooter() {
      var host = $("#site-footer");
      if (!host) return;
      host.className = "site-footer";
      host.innerHTML =
        '<div class="wrap"><div class="footer-row">' +
        "<div><strong>ชมรมอนามัยสิ่งแวดล้อมจังหวัดบุรีรัมย์</strong><br>" +
        '<span id="footer-addr" class="small"></span></div>' +

        '<a href="' + pageUrl("privacy") + '" target="_top">นโยบายคุ้มครองข้อมูลส่วนบุคคล</a>' +
        '<a href="' + pageUrl("terms") + '" target="_top">ข้อตกลงการใช้บริการ</a>' +

    /* ================= ชื่อ-สกุล และหน่วยงาน ================= */
    function fullName(m) {
      if (!m) return "";
      var t = m.title === "อื่นๆ" ? m.title_other : m.title;
      return [t, m.first_name, m.last_name].filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
    }
    function orgLabel(m, orgTypes) {
      if (!m) return "";
      if (m.org_name) return m.org_name;
      if (m.org_type_code === "other") return m.org_type_other || "";
      var t = (orgTypes || []).filter(function (o) {
        return o.code === m.org_type_code;
      })[0];
      return t ? t.name : "";
    }

    function badge(map, key) {
      // hasOwnProperty กันค่าอย่าง "constructor" ที่มีอยู่ในต้นแบบของอ็อบเจ็กต์ทุกตัว
      var s = Object.prototype.hasOwnProperty.call(map, key)
        ? map[key]
        : { label: key || "-", cls: "badge" };
      return '<span class="badge ' + esc(s.cls) + '">' + esc(s.label) + "</span>";
    }
