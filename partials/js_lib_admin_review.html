<script>
  /*!
  * admin-review.js - ส่วนที่หน้าตรวจใบสมัครและหน้าตรวจสลิปใช้ร่วมกัน
  *
  * ระบบผู้ดูแลแยกสองหน้าออกจากกัน เพราะเป็นงานของคนละสิทธิ์
  *   admin/applications.html  ตรวจใบสมัคร  พื้นที่งาน applications
  *   admin/payments.html      ตรวจสลิป     พื้นที่งาน payments
  *
  * แต่ทั้งสองหน้าต้องแสดง "ข้อมูลผู้สมัคร" ชุดเดียวกัน และดึงรายการชำระเงิน
  * ล่าสุดด้วยตรรกะเดียวกัน ถ้าทำซ้ำสองที่จะเพี้ยนกันเมื่อแก้ข้างเดียว
  * จึงรวมไว้ที่ไฟล์นี้ ส่วนที่ต่างกันจริง (แท็บ ปุ่ม และ RPC) อยู่ในไฟล์ของแต่ละหน้า
  *
  * การกันสิทธิ์จริงอยู่ที่ฐานข้อมูล (RLS + require_area ในทุกฟังก์ชัน)
  * ไฟล์นี้และเมนูเป็นเพียงการไม่พาผู้ใช้ไปเจอทางตัน
  */
  (function (global) {
    "use strict";
    var A = global.App;

    /** แถวข้อมูลใน <dl class="dl"> ค่าว่างแสดงเป็นขีด */
    function dt(k, v) {
      if (v === null || v === undefined || v === "") v = "-";
      return "<dt>" + A.esc(k) + "</dt><dd>" + v + "</dd>";
    }

    /*
    * รายการชำระเงินที่ควรสนใจของใบสมัครหนึ่งใบ
    * ให้ความสำคัญกับรายการที่ยังรอตรวจสอบก่อน ถ้าไม่มีจึงเอารายการล่าสุด
    */
    function latestPayment(row) {
      var ps = (row.payments || []).slice().sort(function (a, b) {
        return new Date(b.created_at) - new Date(a.created_at);
      });
      return ps.filter(function (p) { return p.status === "pending"; })[0] || ps[0] || null;
    }

    /** หัวการ์ด: ชื่อผู้สมัคร เลขที่ใบสมัคร ประเภท และป้ายสถานะ */
    function headHtml(row, m) {
      return '<div class="card-head"><div><h3 class="mb-0">' + A.esc(A.fullName(m)) + "</h3>" +
        '<span class="small muted">' +
        A.esc(row.app_no || "-") + " · " +
        (row.app_type === "renew" ? "ต่ออายุ" : "สมัครใหม่") +
        (m.member_code ? " · รหัส " + A.esc(m.member_code) : "") +
        (row.submitted_at ? " · ยื่น " + A.esc(A.fmt.thaiDateTime(row.submitted_at)) : "") +
        "</span></div>" + A.badge(A.APP_STATUS, row.status) + "</div>";
    }

    /** ข้อมูลผู้สมัคร ใช้เหมือนกันทั้งสองหน้า */
    function memberHtml(row, m, orgTypes, rec) {
      return '<dl class="dl">' +
        dt("ตำแหน่ง", A.esc(m.position_name)) +
        dt("หน่วยงาน", A.esc(A.orgLabel(m, orgTypes))) +
        dt("อำเภอที่ปฏิบัติงาน", A.esc(m.work_amphoe)) +
        dt("เลขที่ใบอนุญาต",
          m.license_no
            ? A.esc(m.license_no + (m.license_type ? " (" + m.license_type + ")" : ""))
            : "-") +
        dt("เลขบัตร ปชช. (4 ท้าย)", m.national_id_last4 ? "xxxxxxxxx" + A.esc(m.national_id_last4) : "-") +
        dt("อีเมล", A.esc(m.email)) +
        dt("ค่าธรรมเนียม", A.fmt.money(row.fee_amount) + " บาท") +
        (rec ? dt("ใบสำคัญรับเงิน", A.esc(rec.receipt_no) + " (" + A.fmt.thaiDate(rec.issued_at) + ")") : "") +
        (row.review_note ? dt("บันทึกการตรวจ", A.esc(row.review_note)) : "") +
        "</dl>";
    }

    /*
    * ผลการยืนยันกับธนาคาร
    *
    * not_checked = ยังไม่ได้เรียกตรวจ
    * disabled    = ยังไม่ได้ตั้งค่าผู้ให้บริการตรวจสลิป
    * verified    = ธนาคารยืนยันว่ามีรายการโอนนี้จริง ยอดและบัญชีปลายทางตรง
    * mismatch    = มีรายการจริง แต่บางอย่างไม่ตรง (ยอด บัญชีปลายทาง หรือวันเวลา)
    * not_found   = ไม่พบรายการโอนนี้ที่ธนาคาร
    * duplicate   = เลขอ้างอิงนี้ถูกใช้กับใบสมัครอื่นไปแล้ว
    * error       = ตรวจไม่สำเร็จด้วยเหตุทางเทคนิค
    */
    var BANK_VERIFY = {
      not_checked: { label: "ยังไม่ได้ตรวจกับธนาคาร", cls: "badge" },
      disabled:    { label: "ไม่ได้เปิดใช้การตรวจกับธนาคาร", cls: "badge" },
      verified:    { label: "ธนาคารยืนยันแล้ว", cls: "badge badge-ok" },
      mismatch:    { label: "ข้อมูลไม่ตรงกับธนาคาร", cls: "badge badge-err" },
      not_found:   { label: "ไม่พบรายการนี้ที่ธนาคาร", cls: "badge badge-err" },
      duplicate:   { label: "เลขอ้างอิงซ้ำกับรายการอื่น", cls: "badge badge-err" },
      error:       { label: "ตรวจกับธนาคารไม่สำเร็จ", cls: "badge badge-warn" }
    };

    /** ป้ายและรายละเอียดผลการยืนยันกับธนาคาร */
    function bankVerifyHtml(pay) {
      var st = pay.bank_verify_status || "not_checked";
      var meta = BANK_VERIFY[st] || BANK_VERIFY.not_checked;
      var r = pay.bank_verify_result || {};
      var rows = [];

      if (r.amount !== undefined && r.amount !== null) {
        rows.push(dt("ยอดที่ธนาคารยืนยัน", A.fmt.money(r.amount) + " บาท"));
      }
      if (r.receiver_account) rows.push(dt("บัญชีปลายทาง", A.esc(r.receiver_account)));
      if (r.receiver_name) rows.push(dt("ชื่อบัญชีปลายทาง", A.esc(r.receiver_name)));
      if (r.sender_name) rows.push(dt("ชื่อผู้โอน (ธนาคาร)", A.esc(r.sender_name)));
      if (r.paid_at) rows.push(dt("วันเวลาที่ธนาคารยืนยัน", A.esc(String(r.paid_at))));
      if (pay.bank_ref) rows.push(dt("เลขอ้างอิงจากธนาคาร", A.esc(pay.bank_ref)));
      if (r.provider) rows.push(dt("ผู้ให้บริการตรวจสลิป", A.esc(r.provider)));

      return '<div class="mt-1"><span class="' + meta.cls + '">' + A.esc(meta.label) + "</span>" +
        (pay.bank_verify_at
          ? ' <span class="tiny muted">ตรวจเมื่อ ' + A.esc(A.fmt.thaiDateTime(pay.bank_verify_at)) + "</span>"
          : "") +
        (r.reason
          ? '<p class="small mb-0" style="color:var(--c-err-700)">' + A.esc(r.reason) + "</p>"
          : "") +
        (rows.length
          ? '<details class="mt-1"><summary class="small">รายละเอียดจากธนาคาร</summary>' +
            '<dl class="dl">' + rows.join("") + "</dl></details>"
          : "") +
        "</div>";
    }

    /** รายการผลตรวจหนึ่งชุดเป็น <ul> */
    function checkListHtml(checks) {
      return '<ul class="check-list">' +
        checks.map(function (c) {
          var cls = c.pass === true ? "p" : c.pass === false ? "f" : "n";
          var mk = c.pass === true ? "✓" : c.pass === false ? "✗" : "–";
          return '<li><span class="ck ' + cls + '">' + mk + "</span><span>" +
            A.esc(c.label) + "</span></li>";
        }).join("") +
        "</ul>";
    }

    /*
    * ผลตรวจสลิปอัตโนมัติแบบย่อ กดเปิดดูได้
    *
    * แสดงผลฝั่งเซิร์ฟเวอร์เป็นหลัก เพราะคำนวณจากไฟล์ที่อัปโหลดจริงและ
    * ค่าธรรมเนียมในฐานข้อมูล ส่วนผลจากเครื่องผู้ใช้เป็นค่าที่ผู้ส่งกำหนดเองได้
    * จึงเก็บไว้ดูเปรียบเทียบเท่านั้น ไม่ใช้ตัดสิน
    */
    function checksHtml(pay) {
      var srv = pay.server_check_result;
      var cli = pay.check_result;
      var out = "";

      if (srv && srv.checks && srv.checks.length) {
        out += '<details class="mt-1" open><summary class="small">ผลตรวจของระบบ (ตรวจฝั่งเซิร์ฟเวอร์)</summary>' +
          checkListHtml(srv.checks) + "</details>";
      }
      if (cli && cli.checks && cli.checks.length) {
        out += '<details class="mt-1"><summary class="small">ผลตรวจจากเครื่องผู้ส่ง (อ้างอิงเท่านั้น)</summary>' +
          checkListHtml(cli.checks) + "</details>";
      }
      return out;
    }

    /*
    * ใครเป็นผู้ตัดสินสลิปใบนี้
    *
    * ตั้งแต่เปิดการออกใบสำคัญรับเงินอัตโนมัติ สลิปที่ธนาคารยืนยันครบทุกเงื่อนไข
    * จะผ่านโดยไม่มีเจ้าหน้าที่กดยืนยัน ฐานข้อมูลบันทึกกรณีนั้นด้วย verified_by = ว่าง
    * เจ้าหน้าที่การเงินต้องแยกออกได้ว่าใบไหนตัวเองเป็นคนตรวจ ใบไหนระบบออกให้
    * เพราะใบสำคัญรับเงินพิมพ์ชื่อผู้ลงนามของชมรมเหมือนกันทั้งสองแบบ
    *
    * รายการที่บันทึกไว้ก่อนมีการอนุมัติอัตโนมัติมี verified_by ครบทุกแถว
    * เงื่อนไขนี้จึงไม่ตีรายการเก่าเป็นรายการที่ระบบออกให้
    */
    function decidedHtml(pay) {
      if (pay.status === "verified") {
        if (!pay.verified_by) {
          return dt("ผู้ตรวจสลิป",
            '<span class="badge badge-ok">ระบบอนุมัติอัตโนมัติ</span> ' +
            '<span class="tiny muted">ธนาคารยืนยันครบทุกเงื่อนไข ' +
            "ไม่ได้ผ่านการกดยืนยันของเจ้าหน้าที่" +
            (pay.verified_at ? " · " + A.esc(A.fmt.thaiDateTime(pay.verified_at)) : "") +
            "</span>");
        }
        return dt("ผู้ตรวจสลิป", "เจ้าหน้าที่กดยืนยัน" +
          (pay.verified_at ? " เมื่อ " + A.esc(A.fmt.thaiDateTime(pay.verified_at)) : ""));
      }
      if (pay.status === "rejected" && pay.verified_at) {
        return dt("ผู้ตรวจสลิป",
          "เจ้าหน้าที่บันทึกว่าไม่ผ่าน เมื่อ " + A.esc(A.fmt.thaiDateTime(pay.verified_at)));
      }
      return "";
    }

    /** บล็อกสลิปพร้อมรูปและผลตรวจ ใช้ที่หน้าตรวจสลิปเท่านั้น */
    function slipHtml(row, pay) {
      if (!pay) {
        return '<div class="alert alert-warn mb-0"><div>' +
          "ยังไม่มีการแนบสลิปสำหรับใบสมัครนี้</div></div>";
      }
      return '<div class="slip-view">' +
        '<div><img class="slip-img" data-slip="' + row.id + '" alt="สลิปการโอนเงิน">' +
        '<a class="btn btn-sm btn-ghost mt-1" data-sliplink="' + row.id +
        '" target="_blank" rel="noopener" hidden>เปิดรูปเต็ม</a></div>' +
        "<div>" + A.badge(A.PAYMENT_STATUS, pay.status) +
        '<dl class="dl mt-1">' +
        dt("จำนวนเงิน", A.fmt.money(pay.amount) + " บาท" +
          (Number(pay.amount) !== Number(row.fee_amount)
            ? ' <span class="badge badge-err">ไม่ตรง</span>' : "")) +
        dt("วันเวลาที่โอน", pay.paid_at ? A.fmt.thaiDateTime(pay.paid_at) : "-") +
        dt("ธนาคาร", A.esc(pay.bank_name)) +
        dt("ผู้โอน", A.esc(pay.payer_name)) +
        dt("เลขอ้างอิง", A.esc(pay.ref_no)) +
        dt("คะแนนตรวจของระบบ",
          pay.server_check_score === null || pay.server_check_score === undefined
            ? '<span class="muted">ยังไม่มี (รายการก่อนเปิดใช้การตรวจฝั่งเซิร์ฟเวอร์)</span>'
            : pay.server_check_score + "/100") +
        dt("คะแนนจากเครื่องผู้ส่ง",
          pay.check_score === null || pay.check_score === undefined
            ? "-"
            : pay.check_score + "/100 <span class=\"tiny muted\">(ผู้ส่งกำหนดเองได้ ไม่ใช้ตัดสิน)</span>") +
        decidedHtml(pay) +
        "</dl>" +
        bankVerifyHtml(pay) +
        checksHtml(pay) +
        (pay.slip_qr_raw
          ? '<details class="mt-1"><summary class="small">ข้อมูล QR บนสลิป</summary>' +
            '<div class="tiny mono" style="word-break:break-all">' + A.esc(pay.slip_qr_raw) +
            "</div></details>"
          : "") +
        (pay.reject_reason
          ? '<p class="small" style="color:var(--c-err-700)">เหตุผลที่ไม่ผ่าน: ' +
            A.esc(pay.reject_reason) + "</p>"
          : "") +
        "</div></div>";
    }

    /*
    * รูปถ่ายไม่ใช่ข้อบังคับของการส่งใบสมัคร ผู้สมัครจึงยื่นได้โดยยังไม่มีรูป
    * ผู้ดูแลอนุมัติได้ตามปกติ แต่ต้องรู้ว่าสมาชิกรายนี้จะพิมพ์บัตรยังไม่ได้
    */
    function photoWarnHtml(m) {
      if (m.photo_path) return "";
      return '<div class="alert alert-warn mb-0"><div>' +
        "<strong>ผู้สมัครยังไม่ได้แนบรูปถ่าย</strong>" +
        "อนุมัติใบสมัครได้ตามปกติ แต่จะพิมพ์บัตรสมาชิกยังไม่ได้จนกว่าจะมีรูปถ่าย " +
        "สมาชิกแนบเองได้ที่หน้าข้อมูลสมาชิกหลังใบสมัครได้รับอนุมัติ" +
        "</div></div>";
    }

    /*
    * ที่อยู่ยังไม่ครบ = ใบสำคัญรับเงินจะไม่มีบรรทัดที่อยู่
    * ออกเอกสารให้ได้ แต่ผู้ตรวจสลิปควรรู้ก่อนกดตรวจผ่าน
    */
    function addressWarnHtml(m) {
      var hasWork = !!(m.org_name && m.work_amphoe);
      var hasHome = !!(m.addr_amphoe);
      if (hasWork || hasHome) return "";
      return '<div class="alert alert-warn mb-0"><div>' +
        "<strong>ผู้สมัครยังไม่ได้กรอกที่อยู่</strong>" +
        "ออกใบสำคัญรับเงินให้ได้ แต่เอกสารจะไม่มีบรรทัดที่อยู่ " +
        "หลักฐานอาจไม่สมบูรณ์สำหรับการเบิกจ่าย" +
        "</div></div>";
    }

    /** โหลดรูปสลิปด้วย signed URL ที่มีอายุจำกัด ไม่เปิด bucket เป็นสาธารณะ */
    function loadSlipImage(row, pay) {
      if (!pay || !pay.slip_path) return;
      A.storage.signedUrl(A.cfg.BUCKETS.slips, pay.slip_path, 3600).then(function (u) {
        if (!u) return;
        var img = A.$('[data-slip="' + row.id + '"]');
        if (!img) return;
        if (/\.pdf($|\?)/i.test(pay.slip_path)) {
          img.outerHTML = '<a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="' +
            A.esc(u) + '">เปิดไฟล์สลิป (PDF)</a>';
          return;
        }
        img.src = u;
        var link = A.$('[data-sliplink="' + row.id + '"]');
        if (link) { link.href = u; link.hidden = false; }
      }).catch(function () {});
    }

    /*
    * ช่อง select ของ PostgREST ที่ทั้งสองหน้าใช้
    * เขียนเป็นบรรทัดเดียวต่อกัน ห้ามมีตัวขึ้นบรรทัดใหม่อยู่ข้างใน
    * เพราะ PostgREST จะถือว่าเป็นชื่อคอลัมน์และตอบ 400
    */
    var SELECT_HEAD =
      "id, app_no, app_type, status, fee_amount, term_years, submitted_at, reviewed_at, review_note," +
      "period_start, period_end," +
      "members!inner(id, user_id, member_code, title, title_other, first_name, last_name, position_name," +
      "org_name, org_type_code, org_type_other, work_amphoe, addr_amphoe, license_no, license_type," +
      "photo_path, status, valid_from, valid_to, national_id_last4, email),";

    var PAYMENT_COLS =
      "id, amount, paid_at, bank_name, payer_name, ref_no, slip_path, slip_sha256," +
      "slip_qr_raw, check_score, check_result, server_check_score, server_check_result," +
      "bank_verify_status, bank_verify_result, bank_verify_at, bank_ref," +
      "status, reject_reason, created_at, verified_at, verified_by";

    var SELECT_TAIL = ",receipts(id, receipt_no, amount, amount_text, issued_at)";

    var SELECT = SELECT_HEAD + "payments(" + PAYMENT_COLS + ")" + SELECT_TAIL;

    /*
    * ใช้กับคิว "สลิปรอตรวจสอบ" ที่ต้องหาใบสมัครจาก "สถานะของสลิป" ไม่ใช่สถานะใบสมัคร
    *
    * admin_replace_slip คงสถานะใบสมัครที่อนุมัติแล้วไว้เป็น approved โดยตั้งใจ
    * เพื่อไม่ให้บัตรสมาชิกที่ออกไปแล้วกลายเป็นบัตรที่ไม่มีใบสมัครรองรับ
    * สลิปใบใหม่จึงเป็น pending อยู่ใต้ใบสมัครที่ไม่ได้อยู่ในสถานะ payment_submitted
    * ถ้าคิวยังกรองด้วยสถานะใบสมัคร สลิปใบนั้นจะไม่ปรากฏให้ตรวจ ทั้งที่ตัวนับบอกว่ามี
    *
    * payments!inner ทำให้เหลือเฉพาะใบสมัครที่มีสลิปตรงเงื่อนไขจริง ๆ
    * ประกอบจากชิ้นส่วนเดียวกับ SELECT เพื่อไม่ให้รายชื่อคอลัมน์สองชุดเพี้ยนกันภายหลัง
    */
